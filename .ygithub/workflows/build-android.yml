name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Cache Unity
      uses: actions/cache@v3
      with:
        path: ~/.unity
        key: ${{ runner.os }}-unity-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}

    - name: Setup Unity
      uses: game-ci/unity-builder@v3
      with:
        unityVersion: 2022.3.29f1
        targetPlatform: Android

    - name: Output APK
      uses: actions/upload-artifact@v3
      with:
        name: AndroidBuild
        path: build/Android
